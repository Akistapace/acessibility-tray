<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#21242c"/>
      <stop offset="100%" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="cursor" x1="70" y1="56" x2="153" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#74b0ff"/>
      <stop offset="100%" stop-color="#3a6fd0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="54" ry="54" fill="url(#bg)"/>

  <!-- mouse pointer -->
  <polygon points="70,56 70,177 98,150 120,194 142,183 120,144 153,144"
    fill="url(#cursor)" stroke="#16233f" stroke-width="5" stroke-linejoin="round"/>

  <!-- face-mesh cluster trailing from the cursor tail -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="194" x2="164" y2="184"/>
    <line x1="164" y1="184" x2="186" y2="214"/>
    <line x1="164" y1="184" x2="140" y2="222"/>
    <line x1="186" y1="214" x2="140" y2="222"/>
    <line x1="120" y1="194" x2="140" y2="222"/>
    <line x1="140" y1="222" x2="108" y2="214"/>
    <line x1="120" y1="194" x2="108" y2="214"/>
  </g>
  <g fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5">
    <circle cx="120" cy="194" r="5"/>
    <circle cx="164" cy="184" r="5"/>
    <circle cx="186" cy="214" r="5"/>
    <circle cx="140" cy="222" r="5"/>
    <circle cx="108" cy="214" r="5"/>
  </g>

  <!-- accent node: the active landmark at the cursor tip -->
  <circle cx="70" cy="56" r="10" fill="#34d399" stroke="#0f9c6f" stroke-width="2"/>
</svg>
